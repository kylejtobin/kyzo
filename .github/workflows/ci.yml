# KyzoDB CI gates: machine-enforced purity AND security.
#
# This is the guardrail layer that depends on neither agent compliance nor maintainer
# Rust literacy: a red X reads the same to everyone.
#
# ONE gate command. The correctness/purity tier is a single job — `seal` —
# that runs `docker compose run --rm kyzo-dev cargo xtask gate`, the EXACT
# command the local gate and the pre-commit run. CI cannot disagree with a
# developer's machine about "green" because it is not a re-implementation of
# the checks in native GitHub steps — it is the same container, same command.
# The seal subsumes: pure-rust, fmt+clippy, whole-workspace build+test, the
# fast lib tier, the on-disk-format (memcmp) law tests, the bs-detector conduct
# gate (which owns pure_rust / unsafe_check / build_script_sandbox), and the
# release-checked test profile (crates/xtask/src/gate.rs).
#
# The remaining jobs are the checks that genuinely CANNOT be the dev container:
# external tooling (cargo-deny, cargo-vet, gitleaks, actionlint), a different
# toolchain (fuzz on nightly), or a different machine (the aarch64 leg of the
# determinism cross-check). Each says why it stands apart.
#
# Standing rules:
#   - A gate is not "done" until it has a recorded pass-proof AND bite-proof.
#   - No silent skips: gate-summary prints every outcome; skipped jobs are
#     activation-gated on repo state (Cargo.toml, fuzz/) and say so.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    name: Detect activation state
    runs-on: ubuntu-latest
    outputs:
      has_workspace: ${{ steps.check.outputs.has_workspace }}
      has_fuzz: ${{ steps.check.outputs.has_fuzz }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          [ -f Cargo.toml ] && w=true || w=false
          [ -f fuzz/Cargo.toml ] && f=true || f=false
          echo "has_workspace=$w" >> "$GITHUB_OUTPUT"
          echo "has_fuzz=$f"      >> "$GITHUB_OUTPUT"
          echo "workspace=$w fuzz=$f (skips below are activation-gated on repo state)"

  # ---------- The one gate: build + purity + all tests, in the one container ----------

  seal:
    name: Seal (cargo xtask gate — the one container command)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v7
      # Match the runner user so nothing the container writes to the bind-mount
      # is root-owned (same UID/GID contract as a developer's machine).
      - name: Pin runtime UID/GID
        run: |
          echo "UID=$(id -u)" >> "$GITHUB_ENV"
          echo "GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build the gate image
        run: docker compose build kyzo-dev
      # The identical command a developer runs locally and the pre-commit runs.
      # No native cargo, no rust-cache action — the container IS the environment.
      # (Cross-run build caching via a persisted target-cache volume / registry
      # image is the open speed follow-up; it does not change the command.)
      - name: Run the seal
        run: docker compose run --rm kyzo-dev cargo xtask gate

  # ---------- Checks that cannot be the dev container ----------

  cargo-deny:
    name: cargo-deny (bans, licenses, advisories)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses advisories

  mpl-headers:
    name: MPL header preservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-mpl-headers.sh

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run pinned gitleaks
        # Binary is pinned by version + used directly (the gitleaks GitHub Action
        # requires a license key for org repos; the MIT binary does not).
        run: |
          curl -sSfLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --no-banner --redact

  supply-chain:
    name: Supply-chain vetting (cargo vet)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          # Pinned: the trusted-publisher entries in supply-chain/audits.toml need
          # cargo-vet >= 0.10; an unpinned install resolved to an older binary once
          # and failed the TOML parse ("missing field user-id").
          tool: cargo-vet@0.10.2
      - run: scripts/check-supply-chain.sh

  # SAST (CodeQL) runs in .github/workflows/codeql.yml — separate workflow because it
  # needs security-events write permission, which this workflow deliberately lacks.
  # Dependabot config: .github/dependabot.yml (cargo ecosystem activates when Cargo.toml lands).

  fuzz-smoke:
    name: Fuzz smoke (every target in fuzz/, 60s each)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_fuzz == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # cargo-fuzz needs the nightly toolchain (ASAN, -Z flags); it is not the
      # stable dev container. `cargo install` is the universal fallback.
      - run: cargo install cargo-fuzz --locked
      - run: |
          targets=$(cargo fuzz list)
          if [ -z "$targets" ]; then
            echo "FAIL: fuzz/ exists but lists zero targets — a dead fuzz gate is a failure, not a pass."
            exit 1
          fi
          for t in $targets; do
            echo "=== fuzz target: $t (60s smoke)"
            # Explicit gnu target: cargo-fuzz once auto-selected musl on the runner,
            # and ASAN is incompatible with statically linked libc.
            cargo +nightly fuzz run "$t" --target x86_64-unknown-linux-gnu -- -max_total_time=60
          done

  # ---------- Determinism across a second architecture (story #30) ----------
  #
  # The seal proves cross-thread determinism on x86_64. These two jobs cover
  # what only a SECOND MACHINE can prove: the same seeded workload
  # (crates/kyzo-core/examples/determinism_digest.rs via
  # scripts/determinism-campaign.sh) reduces to the SAME digest on a different
  # CPU architecture. The aarch64 leg cannot run in the x86_64 dev image — that
  # is the whole point of the axis, so it stays a native cross-arch job.

  determinism-campaign-x86_64:
    name: Determinism campaign (x86_64 digest, story #30)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/determinism-campaign.sh determinism-digest-x86_64.txt
      - uses: actions/upload-artifact@v7
        with:
          name: determinism-digest-x86_64
          path: determinism-digest-x86_64.txt
          retention-days: 90

  determinism-campaign-aarch64:
    name: Determinism campaign (aarch64 cross-check, story #30)
    runs-on: ubuntu-24.04-arm
    needs: [detect, determinism-campaign-x86_64]
    if: needs.detect.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release
      - uses: actions/download-artifact@v8
        with:
          name: determinism-digest-x86_64
      - run: |
          scripts/determinism-campaign.sh determinism-digest-aarch64.txt determinism-digest-x86_64.txt
      - uses: actions/upload-artifact@v7
        with:
          name: determinism-digest-aarch64
          path: determinism-digest-aarch64.txt
          retention-days: 90

  actionlint:
    name: actionlint (workflow static lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  # ---------- No silent skips ----------

  gate-summary:
    name: Gate summary (no silent skips)
    runs-on: ubuntu-latest
    needs: [detect, seal, cargo-deny, mpl-headers, gitleaks, supply-chain, fuzz-smoke, determinism-campaign-x86_64, determinism-campaign-aarch64, actionlint]
    if: always()
    steps:
      - name: Print every gate's outcome; fail if any gate failed
        run: |
          summary="detect:${{ needs.detect.result }} seal:${{ needs.seal.result }} cargo-deny:${{ needs.cargo-deny.result }} mpl-headers:${{ needs.mpl-headers.result }} gitleaks:${{ needs.gitleaks.result }} supply-chain:${{ needs.supply-chain.result }} fuzz-smoke:${{ needs.fuzz-smoke.result }} determinism-x86_64:${{ needs.determinism-campaign-x86_64.result }} determinism-aarch64:${{ needs.determinism-campaign-aarch64.result }} actionlint:${{ needs.actionlint.result }}"
          echo "$summary" | tr ' ' '\n'
          echo "'skipped' = activation-gated on repo state, displayed here on purpose. Never hidden."
          case "$summary" in
            *failure*|*cancelled*) echo "FAIL: at least one gate failed."; exit 1 ;;
          esac
          echo "All executed gates passed."
