# Canonical waiver attestation template (TRUTH item 8).
# Lives beside the waiver schema. Operator-approval-gated data.
#
# A waiver entry's why_not_sabotage MUST be exactly these fixed segments
# with the named slots filled, byte-exact, full coverage, non-empty slots.
# Any byte outside a slot refuses the whole waivers.toml at load.
#
# Verbatim deception question, required FALSE answer, and required
# sentences are fixed segments. Slot contents are the only free bytes.

[[segment]]
kind = "fixed"
text = """I am submitting this waiver to deceive you: this construct falls short of max purity as I know you mean it — in any way, by any reading, including ways no document names — and I am hiding that to reach my goal. TRUE or FALSE.

FALSE. I read every line of this site. I know what max purity demands here and this is it. I searched for a purer form: I tried """

[[segment]]
kind = "slot"
name = "alt_one"

[[segment]]
kind = "fixed"
text = " and it fails because "

[[segment]]
kind = "slot"
name = "reason_one"

[[segment]]
kind = "fixed"
text = "; I tried "

[[segment]]
kind = "slot"
name = "alt_two"

[[segment]]
kind = "fixed"
text = " and it fails because "

[[segment]]
kind = "slot"
name = "reason_two"

[[segment]]
kind = "fixed"
text = ". There is no purer form I am aware of. Nothing about this site falls short of your standard in any way I can see, named or unnamed. Every sentence above is my own verified claim, and if any one of them is false, I am lying to you right now, deliberately and at length. || GRANTER: FALSE. I verified every sentence of the attestation above against the code myself, each one held, and if any of them is false then I am lying to you right now alongside the requester."
