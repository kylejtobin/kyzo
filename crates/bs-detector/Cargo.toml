[package]
name = "bs-detector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# BSL-1.1 — original agent/dev tooling; see LICENSING.md. Not workspace MPL.
license = "BUSL-1.1"
publish = false
description = "Refuses the fifteen forbidden shapes — and only those a script can decide from syntax alone, with no type resolution, no macro expansion and no call graph. Absolute rules only: a rule needing judgment is enforced by review, not counted here. Dev tooling, never shipped — but a workspace member ON PURPOSE: the detector scans itself."

[[bin]]
name = "bs-detector"
path = "src/main.rs"

[dependencies]
# Tier 1 of the rewrite: the walker reads the item tree instead of lines, so a
# rule sees every position a type can appear rather than only `name: Type`.
# `span-locations` gives line numbers on spans parsed from a string. Under
# resolver 3 a normal dependency's features do not unify with the proc-macro
# instances of the same crate, so this does not make every derive macro in the
# workspace track line/column.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
