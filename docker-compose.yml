# The one gate environment. EVERY build/test/clippy/bench/detector run happens
# here — there is no native path (pre-bash-guard.sh nudges, .githooks/pre-commit
# and CI both call in here). One image, one service, one command shape:
#
#     docker compose run --rm kyzo-dev <cmd>
#
# `run --rm` is the whole lifecycle: grab the bind-mounted tree, run <cmd>,
# tear the container down on exit. Nothing persists but the caches. The merge
# seal is `docker compose run --rm kyzo-dev cargo xtask gate`.
#
# Runtime user is the host developer (UID/GID from the environment, default
# 1000). The image used to run as root; that contaminated host ./target when
# isolation slipped. Do not run this stack as root.
#
# Target-dir architecture (why builds are reliable): cargo writes to the
# `target-cache` NAMED VOLUME at /target (CARGO_TARGET_DIR), NOT the host's
# ./target. An anonymous volume shadows /workspace/target so the host's target
# dir — which may hold a binary linked against a different glibc — is INVISIBLE
# in-container. Result: the only binary the container can run is one it built
# itself. `cargo xtask run` executes it; never hand-invoke ./target/... .
services:
  kyzo-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Shadow the host's ./target with an empty anonymous volume so a
      # host-built binary (possibly a different glibc) is never visible or
      # runnable in-container. cargo builds to /target (below) instead.
      - /workspace/target
      - cargo-cache:/cargo
      - target-cache:/target
    environment:
      HOME: /home/kyzo
      PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      RUSTUP_HOME: /usr/local/rustup
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /target
      RUST_BACKTRACE: "1"
      RUST_TEST_THREADS: "4"
    # SYS_ADMIN solely so the build-script-sandbox gate check can create a network
    # namespace (unshare --net) around each build-script run; Docker's default seccomp
    # blocks unprivileged CLONE_NEWUSER here (kill-tested 2026-07-13). Not `privileged`.
    cap_add:
      - SYS_ADMIN
    # /dev/fuse so the kyzo-crashfs FUSE crash matrix actually RUNS in-container.
    # Without it the matrix silently reported green while never executing —
    # vacuous-green is exactly what the trials zone forbids.
    devices:
      - /dev/fuse
    mem_limit: 32g
    cpus: 16
    command: bash

volumes:
  cargo-cache:
  target-cache:
